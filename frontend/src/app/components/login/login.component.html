<div class="login-container">
  <div class="cyber-card card-teal login-card">
    <div class="console-header">
      <div class="terminal-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="console-title">SECURE_GATEWAY_v1.0.4</div>
    </div>

    <div class="logo-area">
      <div class="icon-pulse">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h2>AUTO-TRIAGE INCIDENT RESPONDER</h2>
      <p class="subtitle">Security Operations Center Portal</p>
    </div>

    <div *ngIf="error" class="cyber-alert cyber-alert-danger">
      <strong>[ACCESS DENIED]:</strong> {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">OPERATOR EMAIL</label>
        <div class="input-container">
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="cyber-input" 
            [(ngModel)]="email" 
            placeholder="operator@company.com" 
            required 
            autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">ACCESS KEY / PASSWORD</label>
        <div class="input-container">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="cyber-input" 
            [(ngModel)]="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-cyber w-100" [disabled]="loading">
        <span *ngIf="!loading">INITIALIZE SESSION</span>
        <span *ngIf="loading">VALIDATING CREDENTIALS...</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>New operator? </span>
      <a routerLink="/register" class="neon-link">REGISTER ACCESS PROFILE</a>
    </div>
  </div>
</div>
